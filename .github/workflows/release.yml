name: Release

# Runs on a version tag, such as v1.0.0. MinVer reads the version from the tag, the tests run against it (the docs
# and samples must pin it), and the tool is pushed to nuget.org with trusted publishing: the workflow swaps its
# GitHub OIDC token for a short-lived NuGet API key, so no key is stored in the repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  release:
    name: Build, test and publish
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # trusted publishing to nuget.org

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer needs the tags and the history to compute the version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Setpoint.slnx

      - name: Check formatting
        run: dotnet format Setpoint.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Setpoint.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution Setpoint.slnx --no-build --configuration Release

      - name: Pack the tool
        run: dotnet pack src/Setpoint.Cli --no-build --configuration Release --output artifacts/packages

      - name: Check the package version matches the tag
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          package="artifacts/packages/Setpoint.${expected}.nupkg"
          if [ ! -f "$package" ]; then
            echo "::error::Expected $package for tag $GITHUB_REF_NAME, found: $(ls artifacts/packages)"
            exit 1
          fi
          dotnet tool install Setpoint --tool-path artifacts/tool --add-source artifacts/packages --version "$expected"
          actual="$(artifacts/tool/setpoint --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::setpoint --version printed $actual, expected $expected"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section under "## [version]" up to the next "## [".
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > artifacts/release-notes.md
          if [ ! -s artifacts/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi

      - name: Sign in to nuget.org with trusted publishing
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg artifacts/packages/*.snupkg \
            --title "Setpoint ${GITHUB_REF_NAME#v}" --notes-file artifacts/release-notes.md --verify-tag $prerelease
