# yaml-language-server: $schema=https://raw.githubusercontent.com/Quattordici/Setpoint/main/schema/v1/layer.json
version: 1
layer: baseline

locked: [minimumReviewers, protectFromForcePushAndDelete]   # only allowed in the baseline

rules:
  minimumReviewers:
    count: 2
    resetOnPush: true
  requireCommentResolution: true
  allowedMergeTypes: [squash, rebase]
  protectFromForcePushAndDelete: true

azuredevops:
  minimumReviewers:
    creatorVoteCounts: false
    allowDownvotes: false

github:
  pullRequest:
    requireCodeOwnerReview: false
